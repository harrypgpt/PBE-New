# PROPOSED pg_hba.conf lines for the PBE backup login (STAGE-07A-BACKUP-REVIEW.md, F-3).
# NOT APPLIED. To be inserted by the administrator ABOVE every existing line of the server's
# pg_hba.conf, including any "include" lines (first matching line wins), then:
#   SELECT pg_reload_conf();
# (a configuration RELOAD is enough; no restart is needed for pg_hba.conf changes).
# Effect: pbe_backup may connect only to pbe_dev and pbe_test, only over TCP from this computer
# (IPv4 127.0.0.1 or IPv6 ::1), only with SCRAM-SHA-256. Every other database, every other
# address, every Unix-socket connection and every replication connection is refused.
# ("all" does not match replication connections, hence the separate replication lines.)
host    pbe_dev,pbe_test    pbe_backup    127.0.0.1/32    scram-sha-256
host    pbe_dev,pbe_test    pbe_backup    ::1/128         scram-sha-256
host    all                 pbe_backup    all             reject
host    replication         pbe_backup    all             reject
local   all                 pbe_backup                    reject
local   replication         pbe_backup                    reject
